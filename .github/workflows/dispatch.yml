# Deploys the dispatch (the findings website) to GitHub Pages.
# `python -m xania_sim publish` pushes the built site to the `dispatch` branch and then runs this workflow, which
# lives on main so Pages accepts the deployment; it can also be run by hand from the Actions tab.
name: Dispatch

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dispatch
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
