# Copy to roster.toml and edit, then: python -m xania_companions companions --roster roster.toml

master = "Sandro"      # your character: companions take orders from them and post their journals to them
host = "127.0.0.1"
port = 9000            # your MUD (the test MUD uses 9100)
notes = "master"       # journals as in-game notes to: master, all, none, or a name
stagger_seconds = 45   # between logins

[[bot]]
persona = "bram"       # personas/bram.toml: a worried cleric
mode = "companion"     # takes your orders by tell; hunts on its own while you're away
hours = "08:00-23:30"  # daily window (may wrap past midnight); leave out for all day
daily_hours = 8        # cap on hours played per day
session_minutes = 120  # one login; it posts its journal and logs back in after a short break

[[bot]]
persona = "hilda"
mode = "companion"
hours = "10:00-02:00"
daily_hours = 6

[[bot]]
persona = "wren"
mode = "leveller"      # levels on its own, survival first
goal = 20
daily_hours = 4
session_minutes = 60
