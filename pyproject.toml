[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xania-companions"
version = "0.1.0"
description = "Xania Companions: rule-based companion bots for the Xania MUD that play beside you and write their own legends"
requires-python = ">=3.12"
dependencies = []  # stdlib only, plus xania-sim (and through it xania-explorer); see README

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]
# For a fresh setup; with sibling checkouts, `pip install -e ../xania-explorer -e ../xania-sim` instead.
sim = ["xania-sim @ git+https://github.com/abraidotti/xania-sim"]

[tool.setuptools.packages.find]
include = ["xania_companions*"]

[tool.pytest.ini_options]
testpaths = ["tests", "scenarios"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = ["live: needs a built Xania (starts an isolated test MUD)", "slow: takes minutes (e.g. waits for regen ticks)"]
